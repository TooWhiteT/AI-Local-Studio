[versions]
kotlin = "2.2.10"
ktor = "3.2.3"
exposed = "0.61.0"

[libraries]
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.10.2" }
json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.8.1" }
exposed = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
sqlite = { module = "org.xerial:sqlite-jdbc", version = "3.50.3.0" }
netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
server-ws = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
server-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
status = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
partial = { module = "io.ktor:ktor-server-partial-content", version.ref = "ktor" }
body-limit = { module = "io.ktor:ktor-server-body-limit", version.ref = "ktor" }
cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
client-ws = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
log = { module = "org.slf4j:slf4j-simple", version = "2.0.17" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
